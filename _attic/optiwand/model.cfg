// Weapons need no bones, but they do need a CfgModels entry, and the class name has to match
// the p3d filename without its extension. Rename the class if you name the p3d differently.
//
// sections[] is the part that matters here: a selection can only be swapped from config via
// hiddenSelections if it is listed as a section. Without "screen" in this list, the render
// target on the screen plane will silently do nothing.

class CfgSkeletons {
    class Default {
        isDiscrete = 1;
        skeletonInherit = "";
        skeletonBones[] = {};
    };
};

class CfgModels {
    class Default {
        sectionsInherit = "";
        sections[] = {};
        skeletonName = "";
    };

    class mirrorgun: Default {
        sections[] = {"screen"};
        skeletonName = "";
    };
};
